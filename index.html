<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2F5CF6">
<meta name="description" content="提示词框架互动练习 —— AI 助教小智带你学 15 个常用提示词框架,配 10 道互动练习题,答对赢星星。">
<title>提示词框架修炼场</title>
<style>
:root{
  --bg:#EDF1F9; --surface:#FFFFFF; --ink:#1D2742; --ink-soft:#5A6484;
  --line:#DDE4F0; --brand:#2F5CF6; --brand-soft:#E9EEFF;
  --gold:#F5A623; --ok:#0E9F6E; --ok-soft:#E2F6EE; --bad:#E23A55; --bad-soft:#FDE9EC;
  --dark:#161E38;
  --mono:'JetBrains Mono','Cascadia Code',ui-monospace,Consolas,'Courier New',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,'PingFang SC','HarmonyOS Sans SC','Microsoft YaHei','Noto Sans SC',sans-serif;
  color:var(--ink); line-height:1.6; min-height:100dvh;
  background:
    radial-gradient(#D9E1F2 1px, transparent 1px) 0 0/22px 22px,
    linear-gradient(180deg,#F0F4FB 0%,#E7EDF9 100%);
  background-attachment:fixed;
}
.app{max-width:480px;margin:0 auto;padding:22px 18px calc(30px + env(safe-area-inset-bottom));min-height:100dvh;display:flex;flex-direction:column}
.hidden{display:none!important}
.mono{font-family:var(--mono)}
:focus-visible{outline:3px solid rgba(47,92,246,.45);outline-offset:2px;border-radius:6px}
button{font-family:inherit}

/* ---------- screens ---------- */
.screen{display:none;flex:1}
.screen.active{display:block;animation:up .3s ease both}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.4)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes blink{50%{opacity:0}}

/* ---------- home ---------- */
.hero{text-align:center;padding:26px 6px 6px}
.hero h1{font-size:26px;font-weight:800;letter-spacing:.02em;margin-top:12px}
.hero .lead{font-size:14px;color:var(--ink-soft);margin:10px auto 0;max-width:34em;text-align:left}
.lead b{color:var(--brand)}
.bot{filter:drop-shadow(0 10px 18px rgba(47,92,246,.28))}
.menu{display:grid;gap:12px;margin-top:24px}
.mi{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:15px 16px;cursor:pointer;text-align:left;transition:transform .15s ease,box-shadow .15s ease}
.mi:hover{transform:translateY(-1px);box-shadow:0 14px 28px -20px rgba(29,39,66,.45)}
.mi .ic{flex:none;width:44px;height:44px;border-radius:12px;background:var(--brand-soft);display:grid;place-items:center;font-size:22px}
.mi b{display:block;font-size:15.5px}
.mi i{font-style:normal;font-size:12.5px;color:var(--ink-soft)}
.mi .go{margin-left:auto;color:#AEB9D6;font-size:18px}
.home-stats{text-align:center;font-size:12.5px;color:var(--ink-soft);margin-top:20px}
.app-foot{text-align:center;font-size:11.5px;color:#9AA5C4;margin-top:26px}

/* ---------- topbar ---------- */
.topbar{display:flex;align-items:center;gap:10px;padding:4px 0 14px}
.tb-title{font-weight:700;font-size:15.5px}
.tb-meta{margin-left:auto;font-family:var(--mono);font-size:13px;color:var(--ink-soft)}
.tb-meta b{color:var(--ink)}
.tb-btn{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 12px;font-size:13px;cursor:pointer;color:var(--ink)}
.quiz-meta{display:flex;gap:8px;margin-bottom:10px}
.chip{font-size:12px;font-weight:600;color:var(--brand);background:var(--brand-soft);border-radius:999px;padding:3px 11px}
.chip.time{color:#9A6200;background:#FFF1D6}
.chip.time.danger{color:#fff;background:var(--bad);animation:pop .25s ease}
.timer{height:5px;background:var(--line);border-radius:99px;overflow:hidden;margin:0 0 14px}
.timer i{display:block;height:100%;width:100%;background:var(--gold);border-radius:99px;transition:width 1s linear}

/* ---------- learn card ---------- */
.fw-wrap{flex:1}
.fw-card{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 22px 44px -30px rgba(29,39,66,.4)}
.chrome{display:flex;align-items:center;gap:7px;padding:12px 16px;background:#F6F8FD;border-bottom:1px solid var(--line)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.chrome .file{margin-left:6px;font-family:var(--mono);font-size:11.5px;color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fw-body{padding:20px 20px 24px}
.acro{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:6px}
.acro b{font-family:var(--mono);font-size:26px;font-weight:700;background:var(--brand-soft);color:var(--brand);border-radius:12px;min-width:50px;height:50px;display:grid;place-items:center;padding:0 6px}
.acro.small b{font-size:20px;min-width:42px;height:42px;border-radius:10px}
.acro-plain{font-family:var(--mono);font-size:34px;font-weight:700;color:var(--brand);margin-bottom:6px;letter-spacing:-.01em}
.fw-cn{font-size:14px;font-weight:700;color:var(--ink-soft);margin-bottom:12px}
.part{display:flex;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line);align-items:flex-start}
.part:last-of-type{border-bottom:none}
.part .pl{flex:none;font-family:var(--mono);font-weight:700;color:var(--brand);background:var(--brand-soft);border-radius:8px;min-width:30px;height:30px;display:grid;place-items:center;font-size:14px;padding:0 4px}
.part b{display:block;font-size:14px;line-height:1.5}
.part p{font-size:13px;color:var(--ink-soft);line-height:1.6}
.scene{font-size:13px;color:var(--ink-soft);background:#F6F8FD;border:1px solid var(--line);border-radius:12px;padding:10px 13px;margin-top:12px}
.exblock{margin-top:14px;background:var(--dark);border-radius:14px;padding:13px 16px 15px;color:#DCE4F7}
.exblock .lab{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:#8FA0D0;margin-bottom:7px;display:flex;justify-content:space-between;gap:8px}
.exblock .txt{font-size:13.5px;line-height:2}
.exblock mark{background:rgba(245,166,35,.16);color:#FFC964;padding:1px 3px;border-radius:4px;font-weight:600}
.exblock .tk{color:#5F6FA8}
.caret{display:inline-block;width:2px;height:1em;background:#7C8FD6;vertical-align:-2px;margin-left:2px;animation:blink 1.1s steps(1) infinite}
.fw-nav{display:flex;align-items:center;gap:14px;margin-top:16px}
.arrow{flex:none;width:46px;height:46px;border-radius:50%;background:var(--surface);border:1px solid var(--line);font-size:18px;cursor:pointer;color:var(--ink);transition:opacity .15s}
.arrow:disabled{opacity:.35;cursor:default}
.fw-progress{flex:1;height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.fw-progress i{display:block;height:100%;width:0;background:var(--brand);border-radius:99px;transition:width .25s ease}
.fw-hint{margin-top:8px;font-size:12px;color:#9AA5C4}
.toquiz{margin-top:14px}

/* ---------- quiz ---------- */
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px}
.qtag{display:inline-block;font-size:12px;font-weight:600;color:var(--brand);background:var(--brand-soft);border-radius:999px;padding:3px 11px;margin-bottom:10px}
.qtext{font-size:16.5px;font-weight:600;line-height:1.75}
.opts{margin-top:16px;display:grid;gap:10px}
.opts.judge{grid-template-columns:1fr 1fr}
.opt{display:flex;align-items:center;gap:12px;text-align:left;padding:13px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);font-size:14.5px;cursor:pointer;transition:border-color .15s,background .15s;color:var(--ink)}
.opts.judge .opt{justify-content:center;font-weight:600}
.opt .key{flex:none;font-family:var(--mono);font-size:12px;font-weight:700;color:var(--brand);background:var(--brand-soft);border-radius:8px;width:24px;height:24px;display:grid;place-items:center}
.opt.sel{border-color:var(--brand);background:var(--brand-soft)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.opt:disabled:not(.ok):not(.bad):not(.sel){opacity:.55}
.slots{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 12px}
.slot{flex:1;min-width:72px;height:48px;border:1.5px dashed var(--line);border-radius:12px;display:grid;place-items:center;color:#B6C0D8;font-size:12px;background:#FBFCFF;padding:0 4px}
.slot.fill{border-style:solid;border-color:var(--brand);background:var(--brand-soft);color:var(--ink);font-weight:600;font-size:12.5px;cursor:pointer}
.bank{display:flex;gap:8px;flex-wrap:wrap}
.tok{padding:10px 13px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);font-size:13px;cursor:pointer;color:var(--ink)}
.tok .l{font-family:var(--mono);font-weight:700;color:var(--brand);margin-right:6px}
.tok:disabled{opacity:.32;cursor:default}
.submitbar{position:sticky;bottom:0;padding:14px 0 4px;background:linear-gradient(transparent,var(--bg) 34%)}
.fb{margin-top:14px;border-radius:16px;padding:15px 16px;animation:up .25s ease both}
.fb.ok{background:var(--ok-soft);border:1px solid #BCE7D4}
.fb.bad{background:var(--bad-soft);border:1px solid #F6C6CE}
.fb h3{font-size:15px}
.fb.ok h3{color:var(--ok)}
.fb.bad h3{color:var(--bad)}
.fb p{font-size:13px;color:var(--ink-soft);margin-top:6px;line-height:1.7}
.fb .btn{margin-top:13px}
.star-pop{display:inline-block;animation:pop .4s ease}

/* ---------- result ---------- */
.rhero{text-align:center;padding:16px 0 4px}
.ring{position:relative;width:154px;height:154px;margin:4px auto 10px}
.ring svg{transform:rotate(-90deg)}
.ring .track{stroke:#D7DFF0}
.ring .bar{stroke:var(--brand);transition:stroke-dashoffset 1.1s cubic-bezier(.2,.7,.3,1)}
.ring .num{position:absolute;inset:0;display:grid;place-content:center;gap:2px}
.ring .num b{font-family:var(--mono);font-size:40px;line-height:1}
.ring .num i{font-style:normal;font-size:11.5px;color:var(--ink-soft)}
.star-line{font-size:15px;letter-spacing:2px;min-height:24px}
.rmsg{font-size:14px;color:var(--ink-soft);margin-top:6px}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.st{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.st b{font-family:var(--mono);font-size:20px;display:block}
.st i{font-style:normal;font-size:12px;color:var(--ink-soft)}
#reviewSec{margin-top:22px}
#reviewSec h2{font-size:15.5px;margin-bottom:10px}
.rev{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:10px}
.rev .qtag{margin-bottom:8px}
.rq{font-size:14px;font-weight:600;line-height:1.65}
.ra{font-size:13px;margin-top:8px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.ra i{font-style:normal;flex:none;color:#9AA5C4;font-size:12px}
.ra b{font-weight:600}
.c-bad{color:var(--bad)}
.c-ok{color:var(--ok)}
.rex{font-size:12.5px;color:var(--ink-soft);background:#F6F8FD;border-radius:10px;padding:8px 11px;margin-top:10px;line-height:1.7}
.result-actions{margin-top:22px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.linklike{display:block;background:none;border:none;color:var(--ink-soft);font-size:13px;margin:16px auto 0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:14px;padding:13px 18px;font-size:15px;font-weight:600;cursor:pointer;transition:transform .12s ease,opacity .12s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--brand);color:#fff;box-shadow:0 12px 24px -14px rgba(47,92,246,.75)}
.btn.primary:disabled{opacity:.4;cursor:default;box-shadow:none}
.btn.ghost{background:var(--surface);border:1.5px solid var(--line);color:var(--ink)}
.btn.block{width:100%}

@media (max-width:360px){.opts.judge{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">

  <!-- ============ 首页 ============ -->
  <section class="screen active" id="s-home">
    <div class="hero">
      <svg class="bot" viewBox="0 0 120 120" width="96" height="96" aria-hidden="true">
        <line x1="60" y1="15" x2="60" y2="27" stroke="#1D2742" stroke-width="4" stroke-linecap="round"/>
        <circle cx="60" cy="10" r="5" fill="#F5A623"/>
        <rect x="24" y="27" width="72" height="58" rx="18" fill="#2F5CF6"/>
        <rect x="34" y="37" width="52" height="33" rx="10" fill="#fff"/>
        <circle cx="50" cy="53" r="5" fill="#1D2742"/>
        <circle cx="70" cy="53" r="5" fill="#1D2742"/>
        <path d="M52 62 q8 6 16 0" stroke="#1D2742" stroke-width="3" fill="none" stroke-linecap="round"/>
        <rect x="13" y="45" width="8" height="20" rx="4" fill="#1D2742"/>
        <rect x="99" y="45" width="8" height="20" rx="4" fill="#1D2742"/>
        <rect x="42" y="89" width="36" height="10" rx="5" fill="#1D2742"/>
      </svg>
      <h1>提示词框架修炼场</h1>
      <p class="lead">你好,我是 AI 助教<b>小智</b>!提示词(Prompt)框架,是引导 AI 大模型给出高质量回答的结构化模板。掌握不同的框架,就像拥有了多把钥匙,能精准打开 AI 能力的大门。</p>
    </div>
    <nav class="menu" aria-label="学习入口">
      <button class="mi" data-go="learn"><span class="ic">📖</span><span><b>学习框架</b><i>15 张卡片,翻着看,边划边学</i></span><span class="go">→</span></button>
      <button class="mi" data-go="practice"><span class="ic">✏️</span><span><b>互动练习</b><i>10 道题闯关,答对赢星星 ⭐</i></span><span class="go">→</span></button>
      <button class="mi" data-go="challenge"><span class="ic">🏆</span><span><b>挑战自我</b><i>每题限时 20 秒,检验掌握程度</i></span><span class="go">→</span></button>
    </nav>
    <p class="home-stats" id="homeStats"></p>
    <p class="app-foot">提示词框架修炼场 · 学习进度与成绩保存在本机</p>
  </section>

  <!-- ============ 学习 ============ -->
  <section class="screen" id="s-learn">
    <header class="topbar">
      <button class="tb-btn" data-home>← 首页</button>
      <div class="tb-title">学习框架</div>
      <div class="tb-meta" id="learnPos">1/15</div>
    </header>
    <div class="fw-wrap" id="fwCard"></div>
    <div class="fw-nav">
      <button class="arrow" id="fwPrev" aria-label="上一张">←</button>
      <div class="fw-progress"><i id="fwBar"></i></div>
      <button class="arrow" id="fwNext" aria-label="下一张">→</button>
    </div>
    <p class="fw-hint">左右滑动卡片,或点击两侧按钮翻页</p>
    <button class="btn ghost block toquiz" id="fwToQuiz">觉得差不多了?去互动练习 →</button>
  </section>

  <!-- ============ 练习 ============ -->
  <section class="screen" id="s-quiz">
    <header class="topbar">
      <button class="tb-btn" data-home>退出</button>
      <div class="tb-title" id="quizPos">第 1 / 10 题</div>
      <div class="tb-meta">⭐ <b id="starCount">0</b></div>
    </header>
    <div class="quiz-meta">
      <span class="chip" id="modeChip">练习模式</span>
      <span class="chip time hidden" id="timeChip">⏱ 20s</span>
    </div>
    <div class="timer hidden" id="timerWrap"><i id="timeBar"></i></div>
    <div id="qBody"></div>
    <div class="submitbar" id="submitBar"><button class="btn primary block" id="btnSubmit" disabled>提交答案</button></div>
  </section>

  <!-- ============ 成绩 ============ -->
  <section class="screen" id="s-result">
    <div class="rhero">
      <div class="ring">
        <svg width="154" height="154" viewBox="0 0 154 154" aria-hidden="true">
          <circle class="track" cx="77" cy="77" r="62" fill="none" stroke-width="13"/>
          <circle class="bar" id="ringBar" cx="77" cy="77" r="62" fill="none" stroke-width="13" stroke-linecap="round"/>
        </svg>
        <div class="num"><b id="scoreNum">0</b><i>本次得分 / 100</i></div>
      </div>
      <div class="star-line" id="resStars"></div>
      <p class="rmsg" id="resMsg"></p>
    </div>
    <div class="stats3" id="resStats"></div>
    <section id="reviewSec" class="hidden">
      <h2>错题回顾</h2>
      <div id="reviewList"></div>
    </section>
    <div class="result-actions">
      <button class="btn primary block" id="btnRetry">再做一次</button>
      <div class="row2">
        <button class="btn ghost" id="btnChallenge2">🏆 挑战自我</button>
        <button class="btn ghost" id="btnToLearn">📖 去学习框架</button>
      </div>
      <button class="linklike" data-home>回首页</button>
    </div>
  </section>

</div>

<script>
'use strict';
/* ================= 数据:15 个提示词框架 ================= */
const FW=[
 {a:'RTF',cn:'角色 · 任务 · 格式',file:'rtf',parts:[
   ['R','Role 角色','给 AI 一个身份,它就会用这个身份的口吻和专业度来回答'],
   ['T','Task 任务','一句话说清要它做什么'],
   ['F','Format 格式','规定输出的形式:表格、列表、字数……']],
  scene:'日常问答、写文案、做行程 —— 新手最推荐先掌握这一个。',
  ex:'你是[资深旅行博主]。请为我[规划一份成都 3 日游行程],用[表格]输出,包含时间、地点和预算。'},
 {a:'TAG',cn:'任务 · 行动 · 目标',file:'tag',parts:[
   ['T','Task 任务','先交代任务是什么'],
   ['A','Action 行动','具体要做哪些动作'],
   ['G','Goal 目标','做到什么程度算好']],
  scene:'给 AI 布置一项有明确交付标准的工作。',
  ex:'任务:[优化这段产品文案]。行动:[突出使用场景,精简到 100 字]。目标:[让人读完就想下单]。'},
 {a:'APE',cn:'动作 · 目的 · 期望',file:'ape',parts:[
   ['A','Action 动作','让 AI 执行的动作'],
   ['P','Purpose 目的','为什么做这件事'],
   ['E','Expectation 期望','期待得到什么样的结果']],
  scene:'快问快答、小改动,三句话就把需求说清。',
  ex:'帮我[把这篇文章改写成小红书风格],目的是[让更多年轻人愿意读完],期望:[300 字以内,结尾带 3 个话题标签]。'},
 {a:'CARE',cn:'背景 · 行动 · 结果 · 示例',file:'care',parts:[
   ['C','Context 背景','交代相关的背景信息'],
   ['A','Action 行动','要执行的动作'],
   ['R','Result 结果','期望得到的结果'],
   ['E','Example 示例','给一个可以参照的样例']],
  scene:'对输出风格要求高时,带上示例效果立竿见影。',
  ex:'背景:[我要给中学生做科普]。行动:[把量子计算讲得通俗易懂]。结果:[一段 400 字的讲解]。示例:[像这样:「量子比特就像一枚同时正反的硬币……」]。'},
 {a:'RISEN',cn:'角色 · 指令 · 步骤 · 最终目标 · 约束',file:'risen',parts:[
   ['R','Role 角色','让 AI 扮演的身份'],
   ['I','Instructions 指令','总体指令是什么'],
   ['S','Steps 步骤','按什么步骤完成'],
   ['E','End goal 最终目标','最终要达成什么'],
   ['N','Narrowing 约束','限制条件:范围、禁忌、口径']],
  scene:'多步骤的复杂任务:分析报告、方案策划。',
  ex:'角色:[市场分析师]。指令:[分析这份销售数据]。步骤:[先清洗数据,再找趋势,最后给建议]。最终目标:[一页纸的决策摘要]。约束:[只使用本季度数据]。'},
 {a:'RODES',cn:'角色 · 目标 · 细节 · 示例 · 检查',file:'rodes',parts:[

/* ================= 工具 ================= */
const $=s=>document.querySelector(s);
const KEY_BEST='pfgy_best',KEY_SEEN='pfgy_seen';
const store={
  get(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v===null||v===undefined?d:v}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
let view='home';
function show(name){
  view=name;
  document.querySelectorAll('.screen').forEach(el=>el.classList.remove('active'));
  $('#s-'+name).classList.add('active');
  window.scrollTo(0,0);
  if(name==='home')renderHome();
}
function fmt(text){
  return text.replace(/\[(.+?)\]/g,'<span class="tk">[</span><mark>$1</mark><span class="tk">]</span>');
}

/* ================= 首页 ================= */
function renderHome(){
  const seen=store.get(KEY_SEEN,0),best=store.get(KEY_BEST,null);
  $('#homeStats').textContent=`框架卡片已浏览 ${seen}/${FW.length} · 最佳成绩 ${best===null?'—':best+' 分'}`;
}

/* ================= 学习 ================= */
let fi=0;
function renderCard(){
  const f=FW[fi];
  $('#learnPos').textContent=(fi+1)+'/'+FW.length;
  $('#fwBar').style.width=((fi+1)/FW.length*100)+'%';
  const small=f.parts.length>4?' small':'';
  const acro=f.plain
    ?`<div class="acro-plain">${f.a}</div>`
    :`<div class="acro${small}">${f.parts.map(p=>`<b>${p[0]}</b>`).join('')}</div>`;
  $('#fwCard').innerHTML=`
  <article class="fw-card">
    <div class="chrome">
      <span class="dot" style="background:#F26D6D"></span><span class="dot" style="background:#F5C04E"></span><span class="dot" style="background:#57C785"></span>
      <span class="file">prompt/${String(fi+1).padStart(2,'0')}-${f.file}.txt</span>
    </div>
    <div class="fw-body">
      ${acro}
      <div class="fw-cn">${f.cn}</div>
      ${f.parts.map(p=>`<div class="part"><span class="pl">${p[0]}</span><div><b>${p[1]}</b><p>${p[2]}</p></div></div>`).join('')}
      <div class="scene">🎯 适用:${f.scene}</div>
      <div class="exblock"><div class="lab"><span>示例提示词</span><span>${f.a}</span></div>
      <div class="txt">${fmt(f.ex)}<span class="caret"></span></div></div>
    </div>
  </article>`;
  const seen=store.get(KEY_SEEN,0);
  if(fi+1>seen)store.set(KEY_SEEN,fi+1);
  $('#fwPrev').disabled=fi===0;
  $('#fwNext').disabled=fi===FW.length-1;
}
function fwGo(d){const n=fi+d;if(n<0||n>=FW.length)return;fi=n;renderCard();}

/* ================= 练习 ================= */
const LIMIT=20;
let S=null;
function startQuiz(mode){
  stopTimer();
  S={mode,qi:0,answers:[],picked:null,order:[],locked:false,timer:null,left:LIMIT};
  $('#modeChip').textContent=mode==='challenge'?'挑战模式':'练习模式';
  $('#timeChip').classList.toggle('hidden',mode!=='challenge');
  $('#timerWrap').classList.toggle('hidden',mode!=='challenge');
  show('quiz');
  renderQ();
}
function renderQ(){
  const q=QZ[S.qi];
  S.picked=null;S.order=[];S.locked=false;
  $('#quizPos').textContent=`第 ${S.qi+1} / ${QZ.length} 题`;
  $('#starCount').textContent=S.answers.filter(a=>a.ok).length;
  $('#submitBar').classList.remove('hidden');
  let body=`<div class="qcard"><span class="qtag">${q.tag}</span><p class="qtext">${q.q}</p>`;
  if(q.t==='choice'||q.t==='judge'){
    body+=`<div class="opts${q.t==='judge'?' judge':''}">`
      +q.o.map((o,i)=>`<button class="opt" data-i="${i}"><span class="key">${'ABCD'[i]}</span><span>${o}</span></button>`).join('')
      +`</div>`;
  }else{
    let idx=q.seq.map((_,i)=>i);
    do{for(let i=idx.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]];}}
    while(idx.every((v,i)=>v===i));
    body+=`<div class="slots" id="slots">${q.seq.map((_,i)=>`<button class="slot" data-i="${i}">空</button>`).join('')}</div>`
      +`<div class="bank" id="bank">${idx.map(i=>`<button class="tok" data-i="${i}"><span class="l">${q.seq[i].L}</span>${q.seq[i].t}</button>`).join('')}</div>`;
  }
  body+=`</div><div id="fbHost"></div>`;
  $('#qBody').innerHTML=body;
  if(q.t==='order'){
    $('#slots').addEventListener('click',onSlot);
    $('#bank').addEventListener('click',onTok);
  }else{
    $('#qBody').querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>{
      if(S.locked)return;
      S.picked=+b.dataset.i;
      $('#qBody').querySelectorAll('.opt').forEach(x=>x.classList.toggle('sel',x===b));
      updateSubmit();
    }));
  }
  updateSubmit();
  startTimer();
}
function onTok(e){
  const b=e.target.closest('.tok');
  if(!b||b.disabled||S.locked)return;
  const i=+b.dataset.i;
  if(S.order.includes(i))return;
  S.order.push(i);
  paintOrder();updateSubmit();
}
function onSlot(e){
  const s=e.target.closest('.slot');
  if(!s||S.locked)return;
  const pos=+s.dataset.i;
  if(pos>=S.order.length)return;
  S.order.splice(pos,1);
  paintOrder();updateSubmit();
}
function paintOrder(){
  const q=QZ[S.qi];
  $('#slots').querySelectorAll('.slot').forEach((s,i)=>{
    const has=i<S.order.length;
    s.classList.toggle('fill',has);
    s.textContent=has?`${q.seq[S.order[i]].L} · ${q.seq[S.order[i]].t}`:'空';
  });
  $('#bank').querySelectorAll('.tok').forEach(t=>{t.disabled=S.order.includes(+t.dataset.i);});
}
function updateSubmit(){
  const q=QZ[S.qi];
  const ready=q.t==='order'?S.order.length===q.seq.length:S.picked!==null;
  $('#btnSubmit').disabled=!ready||S.locked;
}
function startTimer(){
  stopTimer();
  if(S.mode!=='challenge')return;
  S.left=LIMIT;paintTimer();
  S.timer=setInterval(()=>{S.left--;paintTimer();if(S.left<=0){stopTimer();timeUp();}},1000);
}
function stopTimer(){if(S&&S.timer){clearInterval(S.timer);S.timer=null;}}
function paintTimer(){
  $('#timeChip').textContent='⏱ '+S.left+'s';
  $('#timeBar').style.width=(S.left/LIMIT*100)+'%';
  $('#timeChip').classList.toggle('danger',S.left<=5);
}
function timeUp(){if(!S.locked)grade();}
function grade(){
  S.locked=true;stopTimer();
  const q=QZ[S.qi];
  const ok=q.t==='order'
    ?(S.order.length===q.seq.length&&S.order.every((v,i)=>v===i))
    :S.picked===q.a;
  S.answers.push({qi:S.qi,ok,picked:S.picked,order:[...S.order]});
  $('#starCount').innerHTML=S.answers.filter(a=>a.ok).length;
  if(q.t==='order'){
    $('#bank').querySelectorAll('.tok').forEach(t=>t.disabled=true);
    $('#slots').querySelectorAll('.slot').forEach(s=>s.style.cursor='default');
    if(!ok){S.order=q.seq.map((_,i)=>i);paintOrder();}
  }else{
    $('#qBody').querySelectorAll('.opt').forEach(b=>{
      const i=+b.dataset.i;b.disabled=true;
      if(i===q.a)b.classList.add('ok');
      else if(i===S.picked)b.classList.add('bad');
      b.classList.remove('sel');
    });
  }
  const last=S.qi===QZ.length-1;
  const star=ok?'<span class="star-pop">⭐</span> ':'';
  const head=ok?`${star}答对了,收获一颗星星!`
    :(q.t==='order'?'顺序不对,正确顺序已帮你排好'
    :(S.picked===null?'时间到!看看正确答案':'答错了,看看解析'));
  $('#fbHost').innerHTML=`<div class="fb ${ok?'ok':'bad'}"><h3>${ok?'✓':'✗'} ${head}</h3><p>${q.ex}</p><button class="btn primary block" id="btnNext">${last?'查看成绩':'下一题'}</button></div>`;
  $('#btnNext').addEventListener('click',next);
  $('#btnSubmit').disabled=true;
  $('#submitBar').classList.add('hidden');
}
function next(){
  if(S.qi+1>=QZ.length){renderResult();return;}
  S.qi++;renderQ();
}

/* ================= 成绩 ================= */
function renderResult(){
  stopTimer();
  const okN=S.answers.filter(a=>a.ok).length,badN=QZ.length-okN;
  const score=okN*10,pct=Math.round(okN/QZ.length*100);
  const best=store.get(KEY_BEST,null);
  if(best===null||score>best)store.set(KEY_BEST,score);
  $('#resStars').textContent=okN?('⭐'.repeat(Math.min(okN,10))):'答对就能拿到星星 ⭐';
  $('#resMsg').textContent=score>=90?'太强了,提示词大师就是你了!':score>=70?'很不错!再刷一遍错题就更稳了':score>=40?'有基础!去学习框架补补课吧':'别灰心,先把 15 张卡片翻一遍再来';
  $('#resStats').innerHTML=`<div class="st"><b>${okN}</b><i>答对</i></div><div class="st"><b>${badN}</b><i>答错</i></div><div class="st"><b>${pct}%</b><i>正确率</i></div>`;
  const r=62,c=2*Math.PI*r;
  const bar=$('#ringBar');
  bar.style.strokeDasharray=c;
  bar.style.strokeDashoffset=c;
  $('#scoreNum').textContent=score;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{bar.style.strokeDashoffset=c*(1-score/100);}));
  const wrong=S.answers.filter(a=>!a.ok);
  $('#reviewSec').classList.toggle('hidden',!wrong.length);
  $('#reviewList').innerHTML=wrong.map(a=>{
    const q=QZ[a.qi];
    let yours,corr;
    if(q.t==='order'){
      yours=a.order.length?a.order.map(i=>q.seq[i].L).join(' → '):'未完成';
      corr=q.seq.map(p=>p.L+' '+p.t).join(' → ');
    }else{
      yours=a.picked===null?'未作答(时间到)':q.o[a.picked];
      corr=q.o[q.a];
    }
    return `<div class="rev"><span class="qtag">${q.tag}</span><p class="rq">${q.q}</p>
      <p class="ra"><i>你的答案</i><b class="c-bad">${yours}</b></p>
      <p class="ra"><i>正确答案</i><b class="c-ok">${corr}</b></p>
      <p class="rex">💡 ${q.ex}</p></div>`;
  }).join('');
  $('#btnRetry').textContent=S.mode==='challenge'?'再挑战一次':'再做一次';
  show('result');
}

}));
document.querySelectorAll('[data-home]').forEach(b=>b.addEventListener('click',()=>{stopTimer();show('home');}));
$('#fwPrev').addEventListener('click',()=>fwGo(-1));
$('#fwNext').addEventListener('click',()=>fwGo(1));
$('#fwToQuiz').addEventListener('click',()=>startQuiz('practice'));
$('#btnSubmit').addEventListener('click',()=>{if(!S.locked)grade();});
$('#btnRetry').addEventListener('click',()=>startQuiz(S.mode));
$('#btnChallenge2').addEventListener('click',()=>startQuiz('challenge'));
$('#btnToLearn').addEventListener('click',()=>{fi=0;renderCard();show('learn');});
document.addEventListener('keydown',e=>{
  if(view!=='learn')return;
  if(e.key==='ArrowLeft')fwGo(-1);
  if(e.key==='ArrowRight')fwGo(1);
});
(function(){
  const wrap=$('#fwCard');let tx=null;
  wrap.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;},{passive:true});
  wrap.addEventListener('touchend',e=>{
    if(tx===null)return;
    const dx=e.changedTouches[0].clientX-tx;tx=null;
    if(Math.abs(dx)>46)fwGo(dx<0?1:-1);
  },{passive:true});
})();
renderHome();
</script>
</body>
</html>
